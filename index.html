<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImgObf</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0e0f;
  --bg2: #161618;
  --bg3: #1e1e21;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #e8e6e1;
  --text2: #8a8882;
  --text3: #5a5856;
  --amber: #EF9F27;
  --amber-dim: rgba(239,159,39,0.12);
  --green: #639922;
  --green-dim: rgba(99,153,34,0.12);
  --red: #E24B4A;
  --red-dim: rgba(226,75,74,0.12);
  --radius: 10px;
  --radius-sm: 6px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f4f0;
    --bg2: #eeede9;
    --bg3: #e5e4e0;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #1a1a1a;
    --text2: #666460;
    --text3: #999690;
  }
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
}
#app {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#drop-zone {
  border: 1.5px dashed var(--border2);
  border-radius: var(--radius);
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  background: var(--bg2);
  overflow: hidden;
  position: relative;
  padding: 1.5rem;
}
#drop-zone.drag-over { border-color: var(--amber); background: var(--amber-dim); }
#drop-zone.has-image { cursor: default; min-height: 280px; }
#file-input { display: none; }
#preview { max-width: 100%; max-height: 420px; border-radius: var(--radius-sm); display: none; object-fit: contain; }
#drop-zone.has-image #preview { display: block; }
#drop-zone.has-image .placeholder { display: none; }
.placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
.placeholder .hint { font-size: 13px; color: var(--text2); }
.placeholder .sub { font-size: 11px; color: var(--text3); }
.icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 36px; height: 36px; color: var(--text3); }
#controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 16px;
  height: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg2);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.08s;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--bg3); border-color: var(--border2); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.amber { border-color: rgba(239,159,39,0.4); color: var(--amber); }
.btn.amber:hover:not(:disabled) { background: var(--amber-dim); }
.btn.green { border-color: rgba(99,153,34,0.4); color: var(--green); }
.btn.green:hover:not(:disabled) { background: var(--green-dim); }
.btn.red { border-color: rgba(226,75,74,0.4); color: var(--red); }
.btn.red:hover:not(:disabled) { background: var(--red-dim); }
#status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg2);
  font-size: 12px;
  color: var(--text2);
  border: 1px solid var(--border);
  min-height: 42px;
}
#status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
  transition: background 0.2s;
}
#status-dot.busy { background: var(--amber); animation: pulse 0.9s infinite; }
#status-dot.ok   { background: var(--green); }
#status-dot.err  { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
canvas { display: none; }
@media (min-width: 0px) {
  #notice-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: #FFD400;
    color: #1a1a1a;
    text-align: center;
    padding: 10px 16px;
    font-size: 13px;
    line-height: 1.5;
    border-bottom: 1px solid rgba(0,0,0,0.12);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  body { padding-top: calc(2rem + 48px); }
}
</style>

以下内容由 AI 总结
1. Gilbert 曲线（广义 Hilbert 空间填充曲线）
Hilbert 曲线是一种分形曲线，能以"Z字蛇形但保持空间局部性"的方式，把二维网格里的每个像素恰好访问一次，输出一个像素坐标的有序列表。Gilbert 版本把这推广到任意宽高的矩形（不要求 2 的幂次）。
2. 黄金比例偏移（固定密钥）
偏移量 offset = round((√5−1)/2 × W × H) 是黄金比例乘以像素总数。这不是随机密钥，而是一个确定性、无密钥的固定偏移。
3. 沿曲线的循环移位（置换）
加密：
把曲线第 i 号位置的像素，搬到曲线第 (i+offset)%n 号位置
解密：
逆向——把第 (i+offset)%n 的像素搬回 i
以上内容由 AI 总结
结束
*/
function gilbert2d(w, h) {
  const out = [];
  if (w >= h) gen(0,0,w,0,0,h,out);
  else        gen(0,0,0,h,w,0,out);
  return out;
}
function gen(x,y,ax,ay,bx,by,out) {
  const w=Math.abs(ax+ay), h=Math.abs(bx+by);
  const dax=Math.sign(ax), day=Math.sign(ay);
  const dbx=Math.sign(bx), dby=Math.sign(by);
  if (h===1) { for(let i=0;i<w;i++){out.push([x,y]);x+=dax;y+=day;} return; }
  if (w===1) { for(let i=0;i<h;i++){out.push([x,y]);x+=dbx;y+=dby;} return; }
  let ax2=Math.floor(ax/2), ay2=Math.floor(ay/2);
  let bx2=Math.floor(bx/2), by2=Math.floor(by/2);
  const w2=Math.abs(ax2+ay2), h2=Math.abs(bx2+by2);
  if (2*w>3*h) {
    if((w2%2)&&(w>2)){ax2+=dax;ay2+=day;}
    gen(x,y,ax2,ay2,bx,by,out);
    gen(x+ax2,y+ay2,ax-ax2,ay-ay2,bx,by,out);
  } else {
    if((h2%2)&&(h>2)){bx2+=dbx;by2+=dby;}
    gen(x,y,bx2,by2,ax2,ay2,out);
    gen(x+bx2,y+by2,ax,ay,bx-bx2,by-by2,out);
    gen(x+(ax-dax)+(bx2-dbx),y+(ay-day)+(by2-dby),-bx2,-by2,-(ax-ax2),-(ay-ay2),out);
  }
}

const PHI = (Math.sqrt(5)-1)/2;
let currentBlob=null, originalFile=null, busy=false;
const preview=document.getElementById('preview');
const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
const dz=document.getElementById('drop-zone');

function setStatus(state,msg){
  const d=document.getElementById('status-dot');
  d.className=state;
  document.getElementById('status-txt').textContent=msg;
}
function setButtons(hasImg){
  document.getElementById('btn-enc').disabled=!hasImg||busy;
  document.getElementById('btn-dec').disabled=!hasImg||busy;
  document.getElementById('btn-dl').disabled=!currentBlob;
  document.getElementById('btn-reset').disabled=!hasImg;
}
function loadFile(file){
  if(!file)return;
  originalFile=file; currentBlob=null;
  const url=URL.createObjectURL(file);
  preview.onload=()=>{
    dz.classList.add('has-image');
    setStatus('ok',`loaded: ${file.name}  (${preview.naturalWidth}×${preview.naturalHeight})`);
    setButtons(true);
    URL.revokeObjectURL(url);
  };
  preview.src=url;
}
function handleClick(e){
  if(dz.classList.contains('has-image'))return;
  document.getElementById('file-input').click();
}
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{
  e.preventDefault(); dz.classList.remove('drag-over');
  const f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/'))loadFile(f);
});

function run(mode){
  if(busy||!preview.src)return;
  busy=true;
  setStatus('busy', mode==='enc'?'encrypt...':'decrypt...');
  setButtons(false);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    try{
      const W=preview.naturalWidth, H=preview.naturalHeight;
      cvs.width=W; cvs.height=H;
      ctx.drawImage(preview,0,0);
      const src=ctx.getImageData(0,0,W,H);
      const dst=new ImageData(W,H);
      const curve=gilbert2d(W,H);
      const n=W*H, offset=Math.round(PHI*n);
      for(let i=0;i<n;i++){
        const [ox,oy]=curve[i];
        const [nx,ny]=curve[(i+offset)%n];
        const op=4*(ox+oy*W), np=4*(nx+ny*W);
        if(mode==='enc') dst.data.set(src.data.subarray(op,op+4),np);
        else             dst.data.set(src.data.subarray(np,np+4),op);
      }
      ctx.putImageData(dst,0,0);
      cvs.toBlob(blob=>{
        currentBlob=blob;
        const url=URL.createObjectURL(blob);
        preview.onload=()=>{
          URL.revokeObjectURL(url);
          busy=false;
          setStatus('ok',`${mode==='enc'?'success(encrypt)':'success(decrypt)'} — ${W}×${H} · JPEG 0.95`);
          setButtons(true);
        };
        preview.src=url;
      },'image/jpeg',0.95);
    }catch(e){
      busy=false;
      setStatus('err','error: '+e.message);
      setButtons(true);
    }
  }));
}

function dl(){
  if(!currentBlob)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(currentBlob);
  const baseName=originalFile?originalFile.name.replace(/\.[^.]+$/,''):'image';
  a.download=`${baseName}_obf.jpg`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function reset(){
  if(!originalFile)return;
  currentBlob=null;
  loadFile(originalFile);
}
